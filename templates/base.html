<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EPS | Apreensões{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">PCDF • MVP operacional</p>
                <a class="brand" href="{% url 'apreensoes:dashboard' %}">Assistente de Apreensão</a>
            </div>
            <nav class="topnav">
                <a href="{% url 'apreensoes:dashboard' %}">Operações</a>
                <a href="{% url 'apreensoes:category_list' %}">Categorias</a>
                <a href="/admin/">Admin</a>
            </nav>
        </header>

        <main class="page-content">
            {% if messages %}
                <section class="flash-stack">
                    {% for message in messages %}
                        <div class="flash flash-{{ message.tags|default:'info' }}">{{ message }}</div>
                    {% endfor %}
                </section>
            {% endif %}

            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
